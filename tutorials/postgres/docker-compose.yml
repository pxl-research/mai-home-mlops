services:
  postgres:
    image: postgres:17.6-alpine3.22 
    container_name: postgres
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes: 
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: app
    depends_on: 
      postgres:
        condition: service_healthy
    env_file:
      - .env
    command: ["python", "/app/app.py"]

volumes:
  postgres_data:
    driver: local