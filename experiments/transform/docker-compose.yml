services:
  influxdb:
    image: influxdb:3-core
    container_name: influxdb3
    command: >
      influxdb3 serve
      --node-id host01
      --object-store file
      --data-dir /var/lib/influxdb3
    ports:
      - "8181:8181"
    volumes:
      - influxdb_data:/var/lib/influxdb3
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "Authorization: Bearer apiv3_ULFt_JIGfOHaniOfrh6CxMlnm0TK-yknH0B0_Ob9zu5SpiulEVeOJ5DA8VzXgrWticsLcdhxbyQbcKle4ncBgg", "http://localhost:8181/health"]
      interval: 2s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: transform_influx
    environment:
      - INFLUXDB_URL=http://influxdb:8181
      - INFLUXDB_TOKEN=apiv3_ULFt_JIGfOHaniOfrh6CxMlnm0TK-yknH0B0_Ob9zu5SpiulEVeOJ5DA8VzXgrWticsLcdhxbyQbcKle4ncBgg
      - INFLUXDB_ORG=my-org
      - INFLUXDB_BUCKET=my-bucket
    depends_on:
      influxdb:
        condition: service_healthy

volumes:
  influxdb_data: